# The README leads with an application, and CI only ever ran the unit tests.
#
# `uvicorn backend.main:app` and `scripts/run_product_smoke.py` are the two
# commands a reader is told to run, and nothing had ever run them anywhere but
# on one machine by hand. A suite passing says the functions behave; it does not
# say the app boots. `backend/main.py` assembles itself from `main_parts/*.part`
# at import time, so a part that fails to concatenate is invisible to every test
# that imports a module directly.
#
# The smoke script exits non-zero when any check fails - verified by pointing it
# at a port with nothing listening, where it reports 15 of 16 failed and exits
# 1. Without that, this job would be decoration.

name: product

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: The served frontend must come from the current source
        # 백엔드가 `frontend/dist`를 정적으로 서빙하고, 그 dist는 커밋돼 있다.
        # `src`만 고치고 빌드를 잊으면 **앱은 옛 코드를 서빙하는데 모든 검사가
        # 통과한다** - 제품 스모크는 HTTP API를 치고, 빌드는 성공하고, pytest는
        # 백엔드만 본다. 사용자만 안다.
        #
        # 빌드 결과를 다시 만들어 비교하지 않는다. 그건 툴체인이 바이트 단위로
        # 재현될 때만 성립하고, node/vite 버전이 조금 달라도 거짓 실패를 낸다.
        # 대신 입력의 지문을 비교한다.
        run: python scripts/check_frontend_build_current.py

      - name: The app must import at all
        # Separated from booting it: an import error and a bind failure need
        # different responses, and the assembled-from-parts main.py is where an
        # import error would come from.
        run: python -c "from backend.main import app; print(len(app.routes), 'routes')"

      - name: Boot the server
        run: |
          python -m uvicorn backend.main:app --port 8000 --log-level warning \
            > /tmp/uvicorn.log 2>&1 &
          echo $! > /tmp/uvicorn.pid
          for attempt in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8000/api/health > /dev/null; then
              echo "up after ${attempt}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::the server never became ready"
          cat /tmp/uvicorn.log
          exit 1

      - name: The smoke script must be able to fail
        # A checker that cannot report failure is worse than no checker: it
        # manufactures confidence. This repository has already shipped one - a
        # secret scanner whose regex errored on every call, whose empty output
        # read as "clean". So the script is pointed at a dead port first, and
        # this job only trusts the real run if the control run failed.
        run: |
          if python scripts/run_product_smoke.py --base-url http://127.0.0.1:9 > /dev/null 2>&1; then
            echo "::error::the smoke script reported success against a dead port."
            exit 1
          fi
          echo "control passed: it fails when the server is not there"

      - name: Product smoke
        run: python scripts/run_product_smoke.py --base-url http://127.0.0.1:8000

      - name: Failure-recovery smoke
        # Where the can_rerun/409 disagreement was found. It had been failing
        # three checks for as long as it existed, because nothing ran it: a
        # script in the repository that nobody executes is documentation, not a
        # check.
        run: python scripts/run_failure_recovery_smoke.py --base-url http://127.0.0.1:8000

      - name: Agent Mode smoke
        # README가 앞세우는 기능인데 어떤 검사도 이 경로를 치지 않았다.
        # `backend/agents/executor.py`는 pytest 커버리지 9%였고 스모크 13개를
        # 전부 돌려도 움직이지 않았다. 돌려보니 사슬이 절반에서 멈춰 있었다 -
        # 학습 결과가 요청 스코프가 아니라 공유 기본 버킷에 쓰여서, 바로 다음
        # 설명 도구가 모델을 찾지 못했다.
        #
        # 이 검사가 보는 것은 "200이 왔다"가 아니라 "사슬이 끝까지 갔다"이다.
        # 200은 그때도 계속 오고 있었다.
        run: python scripts/run_agent_mode_smoke.py --base-url http://127.0.0.1:8000

      - name: Workspace flow QA leaves nothing behind
        # It uploads a CSV and used to leave it there; three such files had been
        # committed by accident. `git status` is the assertion.
        run: |
          python scripts/run_workspace_flow_qa.py > /dev/null
          leftover=$(git status --porcelain --untracked-files=all uploaded_datasets | wc -l)
          if [ "$leftover" != "0" ]; then
            echo "::error::the QA run left $leftover file(s) under uploaded_datasets/"
            git status --porcelain --untracked-files=all uploaded_datasets
            exit 1
          fi
          echo "nothing left behind"

      - name: Server log
        if: always()
        run: cat /tmp/uvicorn.log || true
