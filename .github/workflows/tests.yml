# Tests do not prove anything if they quietly stop running.
#
# Every job below asserts how many tests were collected. A dependency that
# vanishes turns importorskip into a silent pass: this repository would go from
# 177 tests to 151 and still show green. The count is the difference between
# "the tests passed" and "the tests ran".

name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Record what a fresh install actually resolved
        # `requirements.txt` names sixteen packages and pins none of them, so a
        # fresh install resolves whatever is current that day. The numbers this
        # repository publishes were produced against one particular set, and
        # nothing said which.
        #
        # This step does not gate; it makes the resolution readable in the log.
        # Two of the sixteen (`shap`, `optuna`) are not installed on the
        # development machine, so their versions cannot be read there - which is
        # why the lock file below is generated from this job rather than written
        # by hand. A pinned version guessed from memory looks verified and is not.
        run: |
          python -m pip freeze --exclude-editable | sort > /tmp/resolved.txt
          echo "── resolved on $(python -V 2>&1)"
          cat /tmp/resolved.txt

      - name: The floor this replaced could not see what it was named for
        # 여기 있던 것은 `Refuse a silently shrinking suite`였고 두 가지가 틀렸다.
        #
        # **하나.** 보는 것이 `pytest --collect-only`의 수집 수인데, 런타임 skip은
        # 수집 수를 바꾸지 않는다. 픽스처 안에서 `pytest.skip()`이 불려도 테스트는
        # 이미 수집된 뒤다. 이름이 말하는 바로 그것을 구조적으로 볼 수 없었다.
        # 2026-08-24에 `document-intelligence`에서 재봤다 — 샘플 PDF를 못 받자
        # **32개가 조용히 skip**됐는데 수집 수는 234 그대로였고 관문은 통과시켰다.
        #
        # **둘.** 하한이 실제보다 한참 낮았다. 네 저장소를 세어보니 이랬다.
        #
        #     agent-safety-core   하한 288 · 실제  565  → 277개가 사라져도 통과
        #     mcp-gateway         하한 146 · 실제  379  → 233개
        #     rag-profile-selector 하한 177 · 실제  348  → 171개
        #     modelmate           하한 281 · 실제 1156  → 875개
        #
        # 합쳐 **1,556개가 사라져도 네 관문 전부 초록불**이다. 하한선은 목록이
        # 줄어드는 것만 보고, 목록이 현실에서 멀어지는 것은 못 본다.
        #
        # 지우고 끝내는 것이 아니라 **두 일을 이미 하는 것들이 있다.**
        #   수집 수  → 바로 아래 "README가 자기 수를 맞게 센다"가 **정확히** 비교한다
        #   런타임 skip → `conftest.py`의 EXPECTED_SKIPS 훅이 집합으로 지킨다
        #
        # 2026-08-24에 document-intelligence만 고치고 나머지 셋을 세지 않았다.
        # **하나를 찾으면 몇 개인지 세는 것**이 이 포트폴리오의 규칙인데 그때
        # 어겼고, 한 회차 뒤에 같은 것이 세 곳에 더 있는 것을 발견했다.
        run: echo "수집 수는 아래 단계가, 건너뛰기는 conftest의 EXPECTED_SKIPS가 지킨다"

      - name: Refuse a README that miscounts its own tests
        run: |
          # These numbers were hand-maintained and drifted twice - the second
          # time in a repository whose README I had just verified. A count kept
          # by hand is a count that rots, so CI compares them.
          claimed=$(grep -oE '[0-9]+ tests' README.md | head -1 | grep -oE '^[0-9]+')
          collected=$(python -m pytest --collect-only -q 2>/dev/null \
            | grep -oE '[0-9]+ tests? collected' | grep -oE '^[0-9]+')
          echo "README says ${claimed:-none}, pytest collects ${collected:-none}"
          if [ "${claimed:-0}" != "${collected:-1}" ]; then
            echo "::error::README claims ${claimed} tests; ${collected} are collected."
            exit 1
          fi

      - name: Refuse a document that points at a file which is not there
        # `backend/main_parts/*.py` became `*.part` in 09a1116 and eighteen
        # references across four documents kept pointing at the old names for
        # two months. Nobody clicked them, so nobody knew. A document that
        # declares itself a record with `<!-- historical: ... -->` is skipped:
        # stale-by-declaration is a record, stale-by-accident is a defect.
        run: python scripts/check_doc_paths.py

      - name: Run the suite
        run: python -m pytest -q -rs   # -rs names every skip and why
